<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f4ee">
<!-- [SEO 최적화] 대구 지역 핵심 키워드 반영 -->
<title>THE303 STUDIO | 대구 달서구 프리미엄 플라잉요가 & 바레</title>
<meta name="description" content="대구 달서구 더303플라잉요가 & 바레 스튜디오. 체형 교정과 다이어트를 위한 원장님 직강 커리큘럼.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Nanum+Myeongjo:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --ink: #30362e; --muted: #777e73; --olive: #65745b; --cream: #f7f4ee;
    --sand: #ece7dc; --white: #fff; --line: #dedfd5; --max: 1200px;
    --program-bg: #efede6; --card-bg: #faf9f4; --contact-bg: #e7e7dd;
    --kakao-yellow: #FEE500;
    --logo-sub-size: 10px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: 'DM Sans', 'Noto Sans KR', sans-serif; word-break: keep-all;
}
a { color: inherit; text-decoration: none; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
img { display: block; width: 100%; object-fit: cover; }

header { position: absolute; top: 0; left: 0; right: 0; z-index: 50; color: white; }
nav {
    max-width: var(--max); margin: auto; display: flex;
    align-items: center; justify-content: space-between; padding: 31px 24px;
}
.logo { font-weight: 700; font-size: 22px; letter-spacing: .18em; }
.logo small { display: block; font-size: var(--logo-sub-size); letter-spacing: .43em; margin-top: 4px; color: inherit; transition: font-size 0.2s; }
.navlinks { display: flex; gap: 30px; align-items: center; font-size: 12px; letter-spacing: .03em; }
.navlinks a:hover { opacity: .7; }
.nav-book { border: 1px solid #ffffffa8; padding: 13px 20px; border-radius: 2px; transition: 0.3s; }
.nav-book:hover { background: white; color: var(--ink); }

.hero {
    min-height: 760px; height: 93vh; max-height: 970px; position: relative;
    color: white; 
    /* background: var(--olive); <-- 사진을 가리던 주범! 완전히 삭제했습니다. */
    display: flex; align-items: center;
}
.hero-img {
    position: absolute; inset: 0;
    /* 경로와 그라데이션 오버레이 강제 적용 */
    background-image: linear-gradient(90deg, rgba(24,34,27,.85) 0%, rgba(24,34,27,.1) 70%), url('./images/hero-bg.jpg') !important;
    background-size: cover; background-position: center right; 
    z-index: 0; /* 지하(-2)에 묻혀있던 사진을 지상(0)으로 꺼냅니다 */
}
.hero-content {
    position: relative; max-width: var(--max); width: 100%;
    padding: 180px 24px 50px; margin: auto; 
    z-index: 10; /* 흰색 글자들은 사진보다 맨 위(10)로 확실하게 올립니다 */
}
.eyebrow { font-size: 11px; letter-spacing: .28em; font-weight: 600; text-transform: uppercase; color: var(--sand); }
.hero h1 { font-size: clamp(46px, 5.7vw, 86px); font-weight: 400; letter-spacing: -.065em; line-height: 1.23; margin: 24px 0 25px; text-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 2px 4px rgba(0,0,0,0.4); }
.hero p { line-height: 1.95; font-size: 15px; font-weight: 300; color: #f2f2f2; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }

.btn {
    display: inline-flex; gap: 24px; align-items: center; justify-content: space-between;
    border: 1px solid var(--olive); background: var(--olive); color: white;
    padding: 17px 23px; min-width: 182px; font-size: 12px; margin-top: 24px; transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
.btn.outline { background: none; color: var(--ink); }
.hero .btn { background: rgba(255,255,255,.96); color: var(--ink); border-color: white; }
.scroll-text { position: absolute; bottom: 38px; left: max(24px, calc((100vw - var(--max))/2)); font-size: 10px; letter-spacing: .26em; opacity: .7; }

.section { padding: 116px 24px; max-width: var(--max); margin: auto; }
.section-label { color: var(--olive); font-size: 11px; letter-spacing: .22em; font-weight: 700; }
.section h2 { font-size: clamp(32px, 3.2vw, 49px); font-weight: 400; letter-spacing: -.06em; line-height: 1.36; margin: 21px 0; }
.section p { font-weight: 300; font-size: 15px; line-height: 1.8; color: #555c52; }

.intro { display: grid; grid-template-columns: 1fr 1fr; gap: 10%; align-items: center; }
.intro-photo { height: 540px; border-radius: 4px; }
.intro-copy { padding: 30px 0; }
.quote { font-family: 'Nanum Myeongjo', serif; font-size: 22px; font-style: italic; color: var(--olive); margin-top: 40px; }

.program-wrap { background: var(--program-bg); }
.program-head { text-align: center; margin-bottom: 46px; }
.program-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
.program-card { background: var(--card-bg); border-radius: 4px; overflow: hidden; transition: transform 0.3s; }
.program-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
.program-card img { height: 300px; }
.program-card-body { padding: 30px; }
.program-card-body h3 { font-size: 22px; font-weight: 500; letter-spacing: -.05em; margin: 8px 0 10px; }
.program-card-body p { margin: 0; line-height: 1.6; }
.program-index { color: var(--olive); font-size: 12px; letter-spacing: .15em; font-weight: 600; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 8%; align-items: center; }
.split img { height: 540px; border-radius: 4px; }
.feature-list { border-top: 1px solid var(--line); margin-top: 34px; }
.feature-list div { padding: 19px 0; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; justify-content: space-between; }
.feature-list span { color: var(--olive); }
.feature-list span[data-text] { color: inherit; }

.gallery { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; }
.gallery img { height: 340px; border-radius: 4px; }

.banner { background: var(--olive); color: white; text-align: center; padding: 104px 20px; }
.banner h2 { font-size: clamp(32px, 4vw, 54px); font-weight: 400; letter-spacing: -.05em; margin: 17px 0; }
.banner p { font-size: 14px; color: #e7eadf; line-height: 1.9; }
.banner .btn { background: white; color: var(--ink); border: white; }

.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9%; }
.contact-details { display: grid; gap: 19px; margin-top: 38px; }
.contact-details div { border-bottom: 1px solid var(--line); padding-bottom: 17px; font-size: 15px; display: flex; justify-content: space-between; }
.contact-details strong { font-size: 12px; color: var(--olive); letter-spacing: .1em; width: 120px; }

.contact-card { background: var(--contact-bg); padding: 54px; display: flex; flex-direction: column; justify-content: center; border-radius: 4px; }
.contact-card h3 { font-weight: 400; font-size: 27px; line-height: 1.5; }

.footer { border-top: 1px solid var(--line); padding: 40px 24px; font-size: 11px; color: #92978c; }
.footer-inner { max-width: var(--max); margin: auto; display: flex; justify-content: space-between; gap: 20px; }
.footer strong { font-size: 20px; color: var(--ink); letter-spacing: .15em; }

.floating-kakao {
    position: fixed; right: 24px; bottom: 30px; z-index: 40;
    background-color: var(--kakao-yellow); color: #3A1D1D;
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15); font-weight: 700; font-size: 11px;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; line-height: 1.2;
}
.floating-kakao:hover { transform: translateY(-6px) scale(1.05); }

/* 편집기 스타일 */
.palette-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 22px; }
.palette-btn { border: 1px solid #d8ddd4; background: white; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-radius: 6px; font-size: 11px; color: #30362e; }
.palette-btn:hover { border-color: #65745b; }
.palette-dots { display: flex; gap: 5px; }
.palette-dots i { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #0002; }

.edit-toggle { position: fixed; left: 24px; bottom: 30px; z-index: 40; border: 0; border-radius: 100px; background: #252f27; color: #fff; box-shadow: 0 8px 26px #0003; padding: 13px 18px; font-size: 12px; }
.editor { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 999; background: #fafaf7; box-shadow: -12px 0 50px #0003; transform: translateX(110%); transition: transform .3s ease; overflow: auto; color: var(--ink); }
.editor.open { transform: translateX(0); }
.editor-header { position: sticky; top: 0; background: #fafaf7; border-bottom: 1px solid var(--line); z-index: 2; padding: 22px; display: flex; justify-content: space-between; align-items: center; }
.editor-header h3 { margin: 0; font-size: 18px; }
.xbtn { border: 0; background: #e8eae3; border-radius: 50%; width: 34px; height: 34px; font-size: 16px; }
.editor-body { padding: 20px 22px 90px; }
.editor-note { font-size: 12px; line-height: 1.7; color: #7c8278; background: #eef0e9; padding: 14px; margin-bottom: 20px; border-radius:4px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 7px; color:#444; }
.field input[type=text], .field textarea { width: 100%; border: 1px solid #d4d8cf; background: #fff; border-radius: 4px; padding: 12px; font-size: 13px; }
.field textarea { height: 90px; resize: vertical; }
.editor details { border-top: 1px solid #d9ddd4; padding: 18px 0; }
.editor summary { cursor: pointer; font-size: 14px; font-weight: 700; }
.editor details > .fields { padding-top: 20px; }
.ed-actions { position: sticky; bottom: 0; background: #fafaf7; border-top: 1px solid var(--line); padding: 14px 22px; display: flex; gap: 8px; z-index:10; }
.ed-actions button, .actionbtn { flex: 1; background: #617259; color: white; border: 0; padding: 12px 9px; font-size: 13px; border-radius:4px; font-weight:600;}
.ed-actions button.alt, .actionbtn.alt { background: #e7eae1; color: #3c4a38; }
.file-help { color: #8e9587; font-size: 11px; margin: 5px 0 0; }
.status { font-size: 12px; color: #4d6a47; margin-top: 10px; font-weight:600; }
.edit-open .edit-toggle { display: none; }

/* 개별 스타일 컨트롤 바 */
.style-control-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; 
    margin-top: 8px; padding: 10px; background: #f0f2ed; border-radius: 6px; border: 1px solid #dce1d8;
}
.style-item { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #555; }
.style-item input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid #cbd1c7; border-radius: 4px; cursor: pointer; background: #fff; }
.style-item input[type=number] { width: 50px; height: 26px; padding: 0 6px; border: 1px solid #cbd1c7; border-radius: 4px; font-size: 12px; }
.style-item select { height: 26px; padding: 0 4px; border: 1px solid #cbd1c7; border-radius: 4px; font-size: 11px; max-width: 100px; }
.reset-btn { padding: 4px 8px; background: #e0e5db; border: 0; border-radius: 4px; color: #333; font-size: 11px; cursor: pointer; height: 26px; font-weight: 600;}
.reset-btn:hover { background: #d0d6cb; }

@media(max-width: 850px) {
    .navlinks { gap: 15px; }
    .navlinks a:not(.nav-book) { display: none; }
    .hero { min-height: 650px; height: 88svh; }
    .hero h1 { font-size: 48px; }
    .section { padding: 85px 22px; }
    .intro, .split, .contact-grid { grid-template-columns: 1fr; gap: 40px; }
    .intro-photo, .split img { height: 420px; }
    .intro-copy { padding: 0; }
    .program-grid { grid-template-columns: 1fr; max-width: 550px; margin: auto; }
    .program-card img { height: 310px; }
    .gallery { grid-template-columns: 1fr 1fr; }
    .gallery img { height: 220px; }
    .gallery img:first-child { grid-column: span 2; height: 290px; }
    .footer-inner { flex-direction: column; }
    .floating-kakao { bottom: 90px; width: 55px; height: 55px; right: 20px; }
    .edit-toggle { bottom: 90px; left: 20px; }
}
@media(max-width: 440px) {
    .hero h1 { font-size: 42px; }
    .hero p { font-size: 13px; }
    .intro-photo, .split img { height: 350px; }
    .section h2 { font-size: 32px; }
    .gallery img { height: 170px; }
}
</style>
</head>
<body>

<header>
    <nav>
        <a class="logo" href="#home">
            <span data-text="brandEn"></span>
            <small data-text="brandSub"></small>
        </a>
        <div class="navlinks">
            <a href="#about">DIRECTOR</a>
            <a href="#program">PROGRAM</a>
            <a href="#space">SPACE</a>
            <a href="#contact">CONTACT</a>
            <a class="nav-book" data-link="booking" href="#contact">
                <span data-text="navButton"></span> ↗
            </a>
        </div>
    </nav>
</header>

<main>
    <section class="hero" id="home">
        <!-- 
          * HTML 하드코딩 처리 완료 
          * 자바스크립트에 의존하지 않으므로 화면 로딩 시 100% 노출됩니다. 
        -->
        <div class="hero-img"></div>
        <div class="hero-content">
            <div class="eyebrow" data-text="heroEyebrow"></div>
            <h1 data-text="heroTitle"></h1>
            <p data-text="heroDesc"></p>
            <a class="btn" data-link="booking" href="#contact">
                <span data-text="heroButton"></span> <span>↗</span>
            </a>
        </div>
    </section>

    <!-- [SEO 최적화] 검색 봇이 이미지를 바로 수집하도록 src 속성에 로컬 경로 지정 -->
    <section class="section intro" id="about">
        <img class="intro-photo" alt="대구 달서구 더303플라잉요가 원장님 프로필" src="./images/director.jpg">
        <div class="intro-copy">
            <div class="section-label" data-text="aboutLabel"></div>
            <h2 data-text="aboutTitle"></h2>
            <p data-text="aboutDesc"></p>
            <div class="quote" data-text="aboutQuote"></div>
        </div>
    </section>

    <div class="program-wrap">
        <section class="section" id="program">
            <div class="program-head">
                <div class="section-label" data-text="programLabel"></div>
                <h2 data-text="programHeadline"></h2>
                <p data-text="programSubtitle"></p>
            </div>
            <div class="program-grid">
                <article class="program-card">
                    <img alt="플라잉요가 클래스" src="./images/flying-yoga.jpg">
                    <div class="program-card-body">
                        <span class="program-index" data-text="program1Index"></span>
                        <h3 data-text="program1Title"></h3>
                        <p data-text="program1Desc"></p>
                    </div>
                </article>
                <article class="program-card">
                    <img alt="바레 클래스" src="./images/barre.jpg">
                    <div class="program-card-body">
                        <span class="program-index" data-text="program2Index"></span>
                        <h3 data-text="program2Title"></h3>
                        <p data-text="program2Desc"></p>
                    </div>
                </article>
                <article class="program-card">
                    <img alt="플라잉댄스 클래스" src="./images/flying-dance.jpg">
                    <div class="program-card-body">
                        <span class="program-index" data-text="program3Index"></span>
                        <h3 data-text="program3Title"></h3>
                        <p data-text="program3Desc"></p>
                    </div>
                </article>
                <article class="program-card">
                    <img alt="지도자과정 클래스" src="./images/instructor.jpg">
                    <div class="program-card-body">
                        <span class="program-index" data-text="program4Index"></span>
                        <h3 data-text="program4Title"></h3>
                        <p data-text="program4Desc"></p>
                    </div>
                </article>
            </div>
        </section>
    </div>

    <section class="section split" id="space">
        <div>
            <div class="section-label" data-text="spaceLabel"></div>
            <h2 data-text="spaceTitle"></h2>
            <p data-text="spaceDesc"></p>
            <div class="feature-list">
                <div><span data-text="feature1"></span> <span>↗</span></div>
                <div><span data-text="feature2"></span> <span>↗</span></div>
                <div><span data-text="feature3"></span> <span>↗</span></div>
            </div>
        </div>
        <img alt="스튜디오 메인 시설" src="./images/space-main.jpg">
    </section>
    
    <section class="section" style="padding-top:0">
        <div class="gallery">
            <img alt="스튜디오 갤러리 이미지 1" src="./images/gallery1.jpg">
            <img alt="스튜디오 갤러리 이미지 2" src="./images/gallery2.jpg">
            <img alt="스튜디오 갤러리 이미지 3" src="./images/gallery3.jpg">
        </div>
    </section>

    <section class="banner">
        <div class="eyebrow" data-text="ctaEyebrow"></div>
        <h2 data-text="ctaTitle"></h2>
        <p data-text="ctaDesc"></p>
        <a class="btn" data-link="booking" href="#contact">
            <span data-text="ctaButton"></span> <span>↗</span>
        </a>
    </section>

    <section class="section contact-grid" id="contact">
        <div>
            <div class="section-label" data-text="contactLabel"></div>
            <h2 data-text="contactTitle"></h2>
            <p data-text="contactDesc"></p>
            <div class="contact-details">
                <div><strong>ADDRESS</strong><span data-text="address"></span></div>
                <div><strong>PHONE</strong><span data-text="phone"></span></div>
                <div><strong>HOURS</strong><span data-text="hours"></span></div>
                <div><strong>INSTAGRAM</strong><span data-text="instagram"></span></div>
            </div>
        </div>
        <div class="contact-card">
            <div class="section-label" data-text="contactCardLabel"></div>
            <h3 data-text="contactCardTitle"></h3>
            <p data-text="contactCardDesc"></p>
            <a class="btn" data-link="booking" href="#contact">
                <span data-text="contactButton"></span> <span>↗</span>
            </a>
            <a class="btn outline" data-link="map" href="#contact">
                <span data-text="mapButton"></span> <span>↗</span>
            </a>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="footer-inner">
        <div>
            <strong data-text="brandEn"></strong>
            <p data-text="footerInfo"></p>
        </div>
        <div>© <span id="year"></span> THE303 STUDIO. ALL RIGHTS RESERVED.</div>
    </div>
</footer>

<a class="floating-kakao" data-link="booking" href="#contact" aria-label="카카오톡 상담">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#3A1D1D" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:2px;">
        <path d="M12 3C6.477 3 2 6.545 2 10.916c0 2.84 1.83 5.32 4.618 6.74-.216.79-1.002 3.66-1.028 3.86-.03.24.113.24.24.16.102-.06 3.23-2.14 4.54-3.03.53.07 1.07.11 1.63.11 5.523 0 10-3.545 10-7.916S17.523 3 12 3z"/>
    </svg>
    상담
</a>

<button class="edit-toggle" id="editToggle" type="button">✎ 홈페이지 편집</button>

<aside class="editor" id="editor" aria-label="홈페이지 콘텐츠 편집">
    <div class="editor-header">
        <h3>홈페이지 콘텐츠 관리</h3>
        <button class="xbtn" id="closeEditor" aria-label="닫기">✕</button>
    </div>
    <div class="editor-body">
        <div class="editor-note">
            <b>데모 편집 모드</b><br>카테고리별로 텍스트, 색상, <b>글자 크기 및 폰트</b>를 수정한 뒤 <b>저장</b>하세요.<br>
            ※ 사진은 HTML 뼈대에 완전히 고정되어 있어 삭제되거나 에러가 나지 않습니다.
        </div>
        <div id="editFields"></div>
        <details>
            <summary>백업·복원·초기화</summary>
            <div class="fields">
                <p class="file-help">수정한 텍스트 및 디자인 설정을 JSON 파일로 내보내거나 가져옵니다.</p>
                <button class="actionbtn alt" id="exportBtn">설정 JSON 내보내기</button>
                <div class="field" style="margin-top:12px">

const $ = x => document.getElementById(x);
const make = (tag, attrs={}, value='') => {

    for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
    if(value) e.textContent = value;
    return e;
};
function safeLink(raw) {
    let v = String(raw||'').trim();
    if(!v) return '#contact';
    try {
        const u = new URL(v);
        if(['https:','http:','tel:','mailto:'].includes(u.protocol)) return v;
    } catch(e) {}
    return '#contact';
}

const FONT_MAP = {'기본 고딕': "'Noto Sans KR',sans-serif", '부드러운 고딕': "'Gowun Dodum',sans-serif", '감성 명조': "'Nanum Myeongjo',serif", '둥근 제목체': "'Jua',sans-serif", '모던 영문': "'Montserrat','Noto Sans KR',sans-serif"};

function render(o) {
    document.body.style.fontFamily = FONT_MAP[o.font] || FONT_MAP['기본 고딕'];
    document.documentElement.style.setProperty('--logo-sub-size', o.logoSubSize || '10px');
    
    document.querySelectorAll('.navlinks a:not(.nav-book)').forEach((el,i) => {
        el.textContent = (o.nav||defaults.nav)[i] ?? defaults.nav[i];
        el.style.color = (o.navColors||{})[i] || '';
    });
    const theme = {...defaults.theme, ...o.theme};
    for(const [key,cssvar] of Object.entries({ink:'--ink',muted:'--muted',olive:'--olive',cream:'--cream',sand:'--sand',programBg:'--program-bg',cardBg:'--card-bg',contactBg:'--contact-bg'})){
        if(/^#[0-9a-fA-F]{6}$/.test(theme[key]||'')) document.documentElement.style.setProperty(cssvar, theme[key]);
    }
    document.querySelector('meta[name="theme-color"]').content = theme.cream;
    
    document.querySelectorAll('[data-text]').forEach(el => {
        const k = el.dataset.text;
        el.textContent = o.text[k] ?? '';
        el.style.whiteSpace = 'pre-line';
        
        el.style.color = (o.textColors||{})[k] || '';
        el.style.fontSize = (o.textSizes||{})[k] || '';
        if ((o.textFonts||{})[k]) el.style.fontFamily = FONT_MAP[(o.textFonts||{})[k]];
        else el.style.fontFamily = ''; 
    });
    
    document.querySelectorAll('[data-link]').forEach(el => {
        const target = safeLink(o.link[el.dataset.link]);
        el.href = target;
        if(target !== '#contact' && !target.startsWith('tel:') && !target.startsWith('mailto:')){
            el.target = '_blank'; el.rel = 'noopener noreferrer';
        } else {
            el.removeAttribute('target'); el.removeAttribute('rel');
        }
    });
    document.title = (o.text.brandEn||'THE303 STUDIO') + ' | 대구 달서구 프리미엄 플라잉요가 & 바레';
}

            const fSel = make('select', {});
            fSel.append(make('option', {value:''}, '기본 폰트'));
            Object.keys(FONT_MAP).forEach(fname => {
                const opt = make('option', {value:fname}, fname);
                if((draft.textFonts||{})[key] === fname) opt.selected = true;
                fSel.append(opt);
            });
            fSel.addEventListener('change', () => {
                draft.textFonts = draft.textFonts||{};
                if(fSel.value) draft.textFonts[key] = fSel.value;
                else delete draft.textFonts[key];
                render(draft);
            });
            fWrap.append(make('span',{},'폰트'), fSel);
            
            cr.append(cWrap, sWrap, fWrap);
            f.append(cr); fields.append(f);
        }
        d.append(fields); root.append(d);
    }
    
    const links = make('details'); links.append(make('summary',{},'🔗 예약·지도 링크'));
    const lf = make('div',{class:'fields'});
    for(const [key,label] of [['booking','예약·카카오톡 URL (플로팅 버튼 동시적용)'],['map','네이버 지도 URL']]) {
        const f = make('div',{class:'field'}), input = make('input',{type:'url', placeholder:'https://...', id:'url-'+key});
        input.value = draft.link[key] || '';
        input.addEventListener('input', () => { draft.link[key] = input.value; render(draft); });
        f.append(make('label',{for:'url-'+key},label), input); lf.append(f);
    }
    links.append(lf); root.append(links);
}

function toggle(open) {
    $('editor').classList.toggle('open', open);
    document.body.classList.toggle('edit-open', open);
}

$('editToggle').onclick = () => toggle(true);
$('closeEditor').onclick = () => toggle(false);

$('saveBtn').onclick = () => {
    try {
        localStorage.setItem(STORE, JSON.stringify(draft));
        persisted = clone(draft);
        $('saveStatus').textContent = '✓ 이 브라우저에 저장했습니다.';
    } catch(e) {
        $('saveStatus').textContent = '⚠️ 저장 오류가 발생했습니다.';
    }
};

$('cancelBtn').onclick = () => {
    try {
        const saved = JSON.parse(localStorage.getItem(STORE));
        if (saved) draft = clone(saved);
        else draft = clone(defaults);
    } catch (e) { draft = clone(defaults); }
    render(draft); build();
    $('saveStatus').textContent = '저장되지 않은 변경사항을 취소했습니다.';
};

$('resetBtn').onclick = () => {
    localStorage.removeItem(STORE);
    draft = clone(defaults);
    location.reload();
};

$('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify(draft, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'the303-content-backup.json';
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 1500);
};

$('importFile').onchange = async e => {
    const file = e.target.files?.[0]; if(!file) return;
    try {
        if(file.size > 20*1024*1024) throw Error('파일이 너무 큽니다.');
        const data = JSON.parse(await file.text());
        
        draft = {
            text: {...defaults.text, ...(data.text||{})}, 
            link: {...defaults.link, ...(data.link||{})},
            theme: {...defaults.theme, ...(data.theme||{})}, 
            textColors: {...(data.textColors||{})},
            textSizes: {...(data.textSizes||{})}, 
            textFonts: {...(data.textFonts||{})},
            navColors: {...defaults.navColors, ...(data.navColors||{})}, 
            font: data.font || defaults.font,
            nav: Array.isArray(data.nav) ? data.nav : defaults.nav.slice(),
            logoSubSize: data.logoSubSize || defaults.logoSubSize
        };
        render(draft); build();
        $('saveStatus').textContent = '백업 데이터를 성공적으로 불러왔습니다.';
    } catch(err) {
        $('saveStatus').textContent = '⚠️ 가져오기 실패: ' + err.message;
    }
    e.target.value = '';
};

document.getElementById('year').textContent = new Date().getFullYear();
render(draft); build();

})();
</script>
